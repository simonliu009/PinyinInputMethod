name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Select Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
        xcode-select -p
    
    - name: Build app
      run: make all
      env:
        MACOSX_DEPLOYMENT_TARGET: "11.0"
    
    - name: Build pkg
      run: make pkg
      env:
        MACOSX_DEPLOYMENT_TARGET: "11.0"
    
    - name: Package app as zip
      run: |
        cd build
        zip -r PinyinInputMethod.zip PinyinInputMethod.app
    
    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for i in 1 2 3; do
          echo "Attempt $i..."
          if gh release create ${{ github.ref_name }} \
            build/PinyinInputMethod.pkg \
            build/PinyinInputMethod.zip \
            --title "Release ${{ github.ref_name }}" \
            --notes "macOS 西蒙输入法安装包\n\n- **PinyinInputMethod.pkg** - 双击安装（推荐）\n- **PinyinInputMethod.zip** - 免安装版本" \
            --repo ${{ github.repository }}; then
            echo "Release created successfully!"
            exit 0
          fi
          echo "Attempt $i failed, waiting 30s..."
          sleep 30
        done
        echo "All attempts failed"
        exit 1
